# News sources. Only RSS + public pages allowed by robots.txt. Never bypass login/paywall/anti-forgery.
# robots.txt checked 2026-10-30: cafef, vietstock, vneconomy, baodautu all permit generic crawling of articles.
crawler:
  user_agent: "VCKG-research-bot/0.1 (academic knowledge-graph project; polite crawler)"
  min_delay_seconds: 2.0
  timeout_seconds: 20
  max_retries: 3
  backoff_base: 1.5
  default_limit_per_feed: 5   # smoke-test size; raise only after parser validation

